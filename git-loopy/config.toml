# git-loopy Config for this repository — ADR-029.
#
# Precedence is CLI flag > env > project > global > built-in default, applied
# PER KEY. All seven rows are written deliberately: a partial table would
# inherit the rest from whoever's laptop the run happens on, and the effective
# routing would vary by machine.
#
# The rule is BRIEF.md's, taken literally — the best balance of speed and
# quality, cost genuinely ignored, and speed wins a tie. It is NOT `calibrate`'s
# rule ("the cheapest pair that clears the AGENTS.md gate"), which optimises for
# a question this repository declines to ask.
#
# Do not edit a row here without editing ADR-029 in the same commit:
# src/tests/ci/test_routing_table.py asserts the two agree.

[routing]
# Nothing blocks on a planning ticket, so there is no speed tie to break, and
# the work is verification-heavy — #97 caught a false web claim, #96 found the
# brief wrong about a Direct Line MCP server.
planning = { model = "claude-opus-5", effort = "max" }

# 272k, and deliberately not `gpt-5.6-terra`: the author is terra, and a
# reviewer that is literally the author is not a reviewer. Every 272k model on
# this roster is GPT, so this buys window and strength, not independence.
review = { model = "gpt-5.6-sol", effort = "xhigh" }

# 272k. Re-scored at this window, the 56 measured iterations breach the
# effective ceiling zero times, against 39% at 200k.
implementation = { model = "gpt-5.6-terra", effort = "high" }
test = { model = "gpt-5.6-terra", effort = "high" }

# The documentation here is enforced (the runbook string-for-string, the ADR
# index by test_durable_record.py), but sonnet and opus both clear it — so the
# tie-break applies, and the faster one wins.
docs = { model = "gpt-5.6-luna", effort = "luna" }

# The roster's fastest model, kept on SPEED grounds — the only justification the
# rule permits now that price is not one. `low` rather than `none` because
# `none` disables reasoning outright and a lockfile bump that goes wrong is a
# red CI.
chore = { model = "gpt-5.6-luna", effort = "low" }

# Diagnosis is the highest-reasoning task and a bad fix deploys (ADR-020).
# `xhigh` not `max` because something is already broken, so it is blocking.
bugfix = { model = "claude-opus-5", effort = "xhigh" }
