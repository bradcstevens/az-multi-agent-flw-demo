name: Frontend Tests

# The frontend's first tests (issue #24). vitest, React Testing Library and
# jsdom were configured in the baseline and nothing ran them; this is the
# workflow that does.
#
# Separate from `test.yml` rather than a job inside it: that workflow is
# triggered on Python paths, so a frontend-only change would not start it, and
# widening its paths would run the whole backend suite for a CSS edit.

on:
  push:
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/App/**'
      - 'scripts/frontend-tests.sh'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/App/**'
      - 'scripts/frontend-tests.sh'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/App

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/App/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run
