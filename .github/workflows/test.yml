name: Test Workflow with Coverage

on:
  push:
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/backend/**/*.py'
      - 'src/tests/**/*.py'
      - 'src/mcp_server/**/*.py'
      - 'src/**/pyproject.toml'
      - 'pyproject.toml'
      - 'conftest.py'
      - 'scripts/**'
      - '.github/requirements.txt'
      - '.github/workflows/test.yml'
      # The frontend's half of the transparency contract (#24). Only these two
      # files, not all of `src/App/**`: a CSS edit must not run the backend
      # suite, but a rename in the parsers or the message-type enum has to run
      # `test_transparency_contract.py`, which is the only thing that spans the
      # socket. The vitest suite hand-writes its payloads and cannot notice.
      - 'src/App/src/models/transparency.ts'
      # The Agent dossier mirrors the backend's MCP allowlist for each store
      # assistant toolbox domain; `test_agent_tool_contract.py` catches a
      # tool renamed on either side before the dossier makes a false claim.
      - 'src/App/src/models/agentDossier.ts'
      - 'src/App/src/models/agentMcpTools.ts'
      # The browser's half of the Simulated ticket contract (#22), for the
      # same reason: `test_ticket_contract.py` is the only thing that spans
      # the socket for the ticket, and `ticket.test.ts` hand-writes its
      # payload and cannot notice a backend rename.
      - 'src/App/src/models/ticket.ts'
      - 'src/App/src/models/enums.tsx'
      # The deploy path's stock-pack suppression (#25). Only these two files,
      # not all of `infra/**`: a Bicep edit must not run the backend suite, but
      # an edit to either post-deploy entry point has to run
      # `test_stock_pack_suppression.py`, which sources one of them and calls
      # its predicate.
      - 'infra/scripts/post-provision/post_deploy.sh'
      - 'infra/scripts/post-provision/post_deploy.ps1'
      # The deploy path itself (ADR-020). `test_deploy_workflow.py` is the only
      # thing that asserts the registry is filled before provisioning, that the
      # image tag is the commit rather than `latest`, and that every parameter
      # `main.parameters.json` reads without a default has a value in the
      # repository. Three of those default to the Placeholder image, so an
      # edit here that drops one does not fail loudly — it reinstates it.
      - '.github/workflows/deploy-main.yml'
      - 'infra/environments/**'
      - 'infra/main.parameters.json'
      # The store assistant's content pack and roster (#19). The pack is the
      # only thing that makes the surface resolve to an assistant at all, and
      # `test_store_pack.py` reads all three: the authored artefacts, the
      # verification tooling, and the knowledge-base registrations they depend
      # on. Named individually for the same reason as above.
      - 'content_packs/store_assistant/**'
      - 'tools/store_pack/**'
      - 'infra/scripts/post-provision/seed_knowledge_bases.py'
      - 'src/App/src/models/storeSurface.ts'
      # The browser's half of the Rehearsed replies (#26). The vitest
      # suite hand-writes its own tasks, so a rename here leaves it
      # green and the chips silently absent; `test_store_pack.py` is
      # the only thing that reads this file and the pack together.
      - 'src/App/src/models/rehearsedReply.ts'
      # The browser's half of the Personal answer (#27). Fourth time, same
      # reason: `test_personal_answer_contract.py` is the only thing that
      # spans the socket for the Mocked unlock, and `personalAnswer.test.ts`
      # hand-writes its payload. `signedInDevice.ts` is here because the same
      # contract asserts that the browser authors no associate name of its own.
      - 'src/App/src/models/personalAnswer.ts'
      - 'src/App/src/models/signedInDevice.ts'
      # The SOP corpus, for the six Quick Tasks (#26). Two of the walkthrough's
      # taps are read out of `content/sop/corpus.toml` rather than restated —
      # the rehearsed honest miss and the rehearsed hit — and the hit names a
      # document under `content/sop/src`. Renaming that document leaves a
      # one-tap task whose answer is a miss, and nothing else in the repository
      # would notice.
      - 'content/sop/corpus.toml'
      - 'content/sop/src/**'
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/backend/**/*.py'
      - 'src/tests/**/*.py'
      - 'src/mcp_server/**/*.py'
      - 'pyproject.toml'
      - 'conftest.py'
      - 'scripts/**'
      - '.github/requirements.txt'
      - 'src/**/pyproject.toml'
      - '.github/workflows/test.yml'
      # The frontend's half of the transparency contract (#24). Only these two
      # files, not all of `src/App/**`: a CSS edit must not run the backend
      # suite, but a rename in the parsers or the message-type enum has to run
      # `test_transparency_contract.py`, which is the only thing that spans the
      # socket. The vitest suite hand-writes its payloads and cannot notice.
      - 'src/App/src/models/transparency.ts'
      # The Agent dossier mirrors the backend's MCP allowlist for each store
      # assistant toolbox domain; `test_agent_tool_contract.py` catches a
      # tool renamed on either side before the dossier makes a false claim.
      - 'src/App/src/models/agentDossier.ts'
      - 'src/App/src/models/agentMcpTools.ts'
      # The browser's half of the Simulated ticket contract (#22), for the
      # same reason: `test_ticket_contract.py` is the only thing that spans
      # the socket for the ticket, and `ticket.test.ts` hand-writes its
      # payload and cannot notice a backend rename.
      - 'src/App/src/models/ticket.ts'
      - 'src/App/src/models/enums.tsx'
      # The deploy path's stock-pack suppression (#25). Only these two files,
      # not all of `infra/**`: a Bicep edit must not run the backend suite, but
      # an edit to either post-deploy entry point has to run
      # `test_stock_pack_suppression.py`, which sources one of them and calls
      # its predicate.
      - 'infra/scripts/post-provision/post_deploy.sh'
      - 'infra/scripts/post-provision/post_deploy.ps1'
      # The deploy path itself (ADR-020). `test_deploy_workflow.py` is the only
      # thing that asserts the registry is filled before provisioning, that the
      # image tag is the commit rather than `latest`, and that every parameter
      # `main.parameters.json` reads without a default has a value in the
      # repository. Three of those default to the Placeholder image, so an
      # edit here that drops one does not fail loudly — it reinstates it.
      - '.github/workflows/deploy-main.yml'
      - 'infra/environments/**'
      - 'infra/main.parameters.json'
      # The store assistant's content pack and roster (#19). The pack is the
      # only thing that makes the surface resolve to an assistant at all, and
      # `test_store_pack.py` reads all three: the authored artefacts, the
      # verification tooling, and the knowledge-base registrations they depend
      # on. Named individually for the same reason as above.
      - 'content_packs/store_assistant/**'
      - 'tools/store_pack/**'
      - 'infra/scripts/post-provision/seed_knowledge_bases.py'
      - 'src/App/src/models/storeSurface.ts'
      # The browser's half of the Rehearsed replies (#26). The vitest
      # suite hand-writes its own tasks, so a rename here leaves it
      # green and the chips silently absent; `test_store_pack.py` is
      # the only thing that reads this file and the pack together.
      - 'src/App/src/models/rehearsedReply.ts'
      # The browser's half of the Personal answer (#27). Fourth time, same
      # reason: `test_personal_answer_contract.py` is the only thing that
      # spans the socket for the Mocked unlock, and `personalAnswer.test.ts`
      # hand-writes its payload. `signedInDevice.ts` is here because the same
      # contract asserts that the browser authors no associate name of its own.
      - 'src/App/src/models/personalAnswer.ts'
      - 'src/App/src/models/signedInDevice.ts'
      # The SOP corpus, for the six Quick Tasks (#26). Two of the walkthrough's
      # taps are read out of `content/sop/corpus.toml` rather than restated —
      # the rehearsed honest miss and the rehearsed hit — and the hit names a
      # document under `content/sop/src`. Renaming that document leaves a
      # one-tap task whose answer is a miss, and nothing else in the repository
      # would notice.
      - 'content/sop/corpus.toml'
      - 'content/sop/src/**'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Check if test files exist
        id: check_tests
        run: |
          if [ -z "$(find src -type f -name 'test_*.py')" ]; then
            echo "No test files found, skipping tests."
            echo "skip_tests=true" >> $GITHUB_ENV
          else
            echo "Test files found, running tests."
            echo "skip_tests=false" >> $GITHUB_ENV
          fi

      - name: Run tests with coverage
        if: env.skip_tests == 'false'
        env:
          PYTHONPATH: src:src/backend
        run: |
          # Run test_app.py first (isolation required). Both backend phases
          # deselect the integration marker: the Guardrail corpus (#13) scores
          # against the live embedding deployment, which CI cannot reach.
          python -m pytest src/tests/backend/test_app.py --cov=src/backend -m "not integration" -q

          # Run remaining backend tests with coverage append
          python -m pytest src/tests/backend --cov=src/backend --cov-append --cov-report=term --cov-report=xml --junitxml=pytest.xml -m "not integration" --ignore=src/tests/backend/test_app.py

          # Run MCP server tests and append their coverage to the backend report.
          python -m pytest src/tests/mcp_server --cov=src/mcp_server --cov-append --cov-report=term --cov-report=xml

      - name: Run CI-tooling tests
        if: env.skip_tests == 'false'
        env:
          PYTHONPATH: src:src/backend
        run: python -m pytest src/tests/ci -q

      - name: Report coverage threshold (advisory)
        if: env.skip_tests == 'false'
        run: python scripts/coverage_report.py

      - name: Pytest Coverage Comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false &&
          env.skip_tests == 'false'
        uses: MishaKav/pytest-coverage-comment@26f986d2599c288bb62f623d29c2da98609e9cd4  # v1.6.0
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
          report-only-changed-files: true

      - name: Skip coverage report if no tests
        if: env.skip_tests == 'true'
        run: |
          echo "Skipping coverage report because no tests were found."