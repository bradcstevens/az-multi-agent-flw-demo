name: Test Workflow with Coverage

on:
  push:
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/backend/**/*.py'
      - 'src/tests/**/*.py'
      - 'src/mcp_server/**/*.py'
      - 'src/**/pyproject.toml'
      - 'pyproject.toml'
      - 'conftest.py'
      - 'scripts/**'
      - '.github/requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - main
      - demo-v4
      - dev
    paths:
      - 'src/backend/**/*.py'
      - 'src/tests/**/*.py'
      - 'src/mcp_server/**/*.py'
      - 'pyproject.toml'
      - 'conftest.py'
      - 'scripts/**'
      - '.github/requirements.txt'
      - 'src/**/pyproject.toml'
      - '.github/workflows/test.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Check if test files exist
        id: check_tests
        run: |
          if [ -z "$(find src -type f -name 'test_*.py')" ]; then
            echo "No test files found, skipping tests."
            echo "skip_tests=true" >> $GITHUB_ENV
          else
            echo "Test files found, running tests."
            echo "skip_tests=false" >> $GITHUB_ENV
          fi

      - name: Run tests with coverage
        if: env.skip_tests == 'false'
        env:
          PYTHONPATH: src:src/backend
        run: |
          # Run test_app.py first (isolation required)
          python -m pytest src/tests/backend/test_app.py --cov=src/backend -q

          # Run remaining backend tests with coverage append
          python -m pytest src/tests/backend --cov=src/backend --cov-append --cov-report=term --cov-report=xml --junitxml=pytest.xml --ignore=src/tests/backend/test_app.py

          # Run MCP server tests and append their coverage to the backend report.
          python -m pytest src/tests/mcp_server --cov=src/mcp_server --cov-append --cov-report=term --cov-report=xml

      - name: Run CI-tooling tests
        if: env.skip_tests == 'false'
        env:
          PYTHONPATH: src:src/backend
        run: python -m pytest src/tests/ci -q

      - name: Report coverage threshold (advisory)
        if: env.skip_tests == 'false'
        run: python scripts/coverage_report.py

      - name: Pytest Coverage Comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false &&
          env.skip_tests == 'false'
        uses: MishaKav/pytest-coverage-comment@26f986d2599c288bb62f623d29c2da98609e9cd4  # v1.6.0
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
          report-only-changed-files: true

      - name: Skip coverage report if no tests
        if: env.skip_tests == 'true'
        run: |
          echo "Skipping coverage report because no tests were found."