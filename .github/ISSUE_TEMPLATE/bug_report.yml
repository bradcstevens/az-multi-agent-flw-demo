name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable set of steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, operating system, and configuration.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other useful details.
