# Corpus manifest for the SOP knowledge the Copilot Studio agent is grounded on.
# Every procedure here is invented. There is no real store, no real employee and no real
# procedure in this corpus - only the banner is the customer's own, by ADR-019.

banner = "Circle K"
store = "Store 223"
locale = "en-US"

[rehearsed_hit]
# The mirror image of the honest miss, and the walkthrough's opening beat (issue #26). The
# cross-platform hop is the demonstration's centrepiece, so the question the presenter taps first
# must land on a document that exists. Named here rather than in the Quick Task alone, because the
# task is authored in a different directory by a different tool: without this, deleting or renaming
# the document below leaves a one-tap task whose answer is an honest miss, and the beat the whole
# architecture claim rests on becomes the beat that says the library does not cover it.
question = "How do I close the store?"
quick_task = "Close the store"
doc_id = "SOP-102"

[honest_miss]
# The rehearsed question the corpus deliberately does not answer, so the presenter can show an
# honest miss on cue instead of stumbling into one. Keep every term below out of the corpus.
question = "How do I restart the car wash after a vehicle stalls in the bay?"
quick_task = "Restart the car wash"
absent_terms = ["car wash", "carwash", "wash bay", "wash tunnel", "bay conveyor"]
rationale = """
Store 223 is written as a forecourt-and-shop site with no vehicle wash, so no procedure covers it.
The question is plausible for a convenience-store associate, is phrased in ordinary store language,
and is close enough to the forecourt procedures to be a fair test of retrieval - which is exactly
why the agent must say plainly that it is not in the library rather than improvise.
"""
